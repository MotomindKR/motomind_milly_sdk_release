name: Release CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    name: Bundle integrity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pyyaml
      - run: python scripts/ci/verify_release.py
      - name: Teaching USB setup without system changes
        run: |
          bash -n scripts/setup_teaching_usb.sh
          bash scripts/setup_teaching_usb.sh --dry-run
  wheels:
    name: Wheel Python ${{ matrix.python }}
    needs: bundle
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only release wheels and their declared dependencies
        run: python scripts/ci/install_wheels.py --with-teaching
      - run: python -m pip check
      - run: python scripts/ci/smoke_wheel.py
      - name: Teaching example without hardware
        run: |
          python examples/python/dxl_only.py --fake --auto-start --duration 0.1
          python examples/python/milly_teleop.py --help
      - name: Camera example without SDK or OpenCV imports
        run: python -S examples/python/camera_preview.py --help
  ros:
    name: ROS2 Humble
    needs: bundle
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      PYTHONNOUSERSITE: '1'
      ROS_LOCALHOST_ONLY: '1'
      ROS_DOMAIN_ID: '173'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git LFS before checkout
        run: |
          apt-get update
          apt-get install -y git-lfs
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install through the public ROS Humble setup script
        run: |
          bash scripts/setup_ros_humble.sh
          .venv_ros/bin/python -m pip install 'pytest>=7,<9'
          .venv_ros/bin/python scripts/ci/install_wheels.py --with-teaching
          .venv_ros/bin/python -m pip check
      - name: Test installed services, topics and lifecycle without CAN
        run: |
          set -euo pipefail
          source scripts/ros_env.sh
          export PYTHONPATH=".github/tests/ros:$PYTHONPATH"
          python -m pytest -q .github/tests/ros --junitxml=ros-test-results.xml
          python scripts/check_ros_install.py
          bash scripts/setup_ros_humble.sh --dry-run
      - name: Reinstall the same bundle through the public setup script
        run: bash scripts/setup_ros_humble.sh
  gate:
    name: Release gate
    if: always()
    needs: [bundle, wheels, ros]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every validation job to pass
        env:
          BUNDLE: ${{ needs.bundle.result }}
          WHEELS: ${{ needs.wheels.result }}
          ROS: ${{ needs.ros.result }}
        run: test "$BUNDLE" = success && test "$WHEELS" = success && test "$ROS" = success
